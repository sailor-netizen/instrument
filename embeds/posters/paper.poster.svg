.dot-pulse { animation: i-pulse 4s ease-in-out infinite; }
.sweep { animation: i-sweep 6s linear infinite; }
.rise { opacity: 0; animation: i-rise 0.5s ease-out forwards; }
@media (prefers-reduced-motion: reduce) {
